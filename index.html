<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>码绘长征路 · 数字颂祖国</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #1a0a0a;
            color: #fff;
            overflow-x: hidden;
        }
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            opacity: 0.25;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
        }
        .star {
            width: 60px;
            height: 60px;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            background-color: #ffd700;
            margin: 0 auto 16px;
            animation: starGlow 3s ease-in-out infinite alternate;
        }
        @keyframes starGlow {
            from {
                box-shadow: 0 0 12px #ffd700, 0 0 24px rgba(255, 215, 0, 0.4);
            }
            to {
                box-shadow: 0 0 20px #ffd700, 0 0 40px rgba(255, 215, 0, 0.7);
            }
        }
        .page-cover {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .page-cover h1 {
            font-size: 48px;
            color: #e63946;
            margin-bottom: 16px;
        }
        .page-cover p {
            font-size: 20px;
            opacity: 0.8;
            max-width: 700px;
            line-height: 1.8;
        }
        .scroll-tip {
            margin-top: 60px;
            font-size: 16px;
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(10px);
            }
        }
        .page-map {
            min-height: 100vh;
            padding: 80px 20px;
            text-align: center;
        }
        .page-map h2 {
            font-size: 32px;
            margin-bottom: 40px;
            color: #ffd166;
        }
        .road-wrap {
            position: relative;
            width: 90%;
            max-width: 900px;
            height: 420px;
            margin: 0 auto;
            background: rgba(80, 20, 20, 0.4);
            border-radius: 16px;
        }
        .road-line {
            position: absolute;
            height: 4px;
            background: linear-gradient(90deg, #ff4444, #ffdd44);
            top: 50%;
            left: 5%;
            right: 5%;
        }
        .point {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #ff3333;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: all 0.3s;
        }
        .point:hover {
            transform: translate(-50%, -50%) scale(1.3);
            box-shadow: 0 0 15px #ff4444;
        }
        .point span {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 14px;
        }
        .p1 {
            left: 8%;
            top: 50%;
        }
        .p2 {
            left: 22%;
            top: 36%;
        }
        .p3 {
            left: 38%;
            top: 30%;
        }
        .p4 {
            left: 54%;
            top: 62%;
        }
        .p5 {
            left: 72%;
            top: 40%;
        }
        .p6 {
            left: 92%;
            top: 50%;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99;
        }
        .modal-box {
            background: #221111;
            padding: 32px;
            border-radius: 12px;
            max-width: 520px;
            border: 1px solid #ff5555;
        }
        .modal-box h3 {
            color: #ffd166;
            margin-bottom: 12px;
        }
        .modal-box p {
            line-height: 1.7;
            opacity: 0.9;
        }
        .close-btn {
            margin-top: 20px;
            padding: 8px 20px;
            background: #e63946;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
        .page-message {
            min-height: 80vh;
            padding: 80px 20px;
            text-align: center;
        }
        .page-message h2 {
            font-size: 32px;
            margin-bottom: 30px;
            color: #ffd166;
        }
        #msg-input {
            width: 90%;
            max-width: 500px;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: #2c1818;
            color: #fff;
            border: 1px solid #aa4444;
        }
        #gen-btn {
            margin-top: 18px;
            padding: 12px 28px;
            background: #e63946;
            border: none;
            color: #fff;
            font-size: 17px;
            border-radius: 8px;
            cursor: pointer;
        }
        .code-msg {
            margin-top: 24px;
            padding: 20px;
            background: #111;
            border-radius: 8px;
            color: #4cf777;
            font-family: Consolas;
            min-height: 100px;
            white-space: pre-wrap;
            text-align: left;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .page-end {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .page-end h2 {
            font-size: 36px;
            color: #ffd166;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    <div class="container">
        <section class="page-cover">
            <div class="star"></div>
            <h1>码绘长征路 · 数字颂祖国</h1>
            <p>信息工程学院国庆主题交互作品<br>以代码为笔，追溯长征星火，致敬祖国77载华诞</p>
            <div class="scroll-tip">向下滚动探索长征路线 ↓</div>
        </section>
        <section class="page-map">
            <h2>交互式长征路线</h2>
            <div class="road-wrap">
                <div class="road-line"></div>
                <div class="point p1" data-title="瑞金" data-info="中央红军从江西瑞金启程，8.6万将士踏上战略转移的万里征途，伟大长征正式开启。">
                    <span>瑞金</span>
                </div>
                <div class="point p2" data-title="湘江战役" data-info="长征最惨烈一战。红军浴血奋战突破第四道封锁线，付出巨大牺牲，是决定中国革命生死存亡的重要一战。">
                    <span>湘江战役</span>
                </div>
                <div class="point p3" data-title="遵义会议" data-info="中国革命生死攸关的转折点。会议确立毛泽东在党中央和红军的领导地位，挽救了党、红军与中国革命。">
                    <span>遵义会议</span>
                </div>
                <div class="point p4" data-title="飞夺泸定桥" data-info="红军战士冒着炮火攀着光秃秃铁索冲锋，强渡大渡河，冲破天险，打开北上通道。">
                    <span>飞夺泸定桥</span>
                </div>
                <div class="point p5" data-title="夹金山" data-info="红军翻越长征第一座大雪山，严寒缺氧、风雪刺骨，凭借坚定信念征服人迹罕至的高山。">
                    <span>夹金山</span>
                </div>
                <div class="point p6" data-title="会宁会师" data-info="红一、二、四方面军在甘肃会宁胜利会师，标志长征胜利结束，创造人类历史上的伟大远征。">
                    <span>会宁会师</span>
                </div>
            </div>
            <p style="margin-top:20px;opacity:0.7;">点击地图上红色圆点查看历史故事</p>
        </section>
        <section class="page-message">
            <h2>生成代码风格爱国寄语</h2>
            <input id="msg-input" placeholder="输入你的一句祝福，例如：以代码报国，以青春筑梦">
            <br>
            <button id="gen-btn">转为代码寄语</button>
            <div class="code-msg" id="code-out">// 生成内容会展示在这里</div>
        </section>
        <section class="page-end">
            <h2>以代码为笔<br>绘山河壮阔<br>贺祖国华诞</h2>
        </section>
    </div>
    <div class="modal" id="modal">
        <div class="modal-box">
            <h3 id="m-title"></h3>
            <p id="m-info"></p>
            <button class="close-btn">关闭</button>
        </div>
    </div>
<script>
const canvas = document.getElementById('canvas-bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
})
const chars = "01ABCDEFG长征星火77";
const fontSize = 16;
const col = canvas.width / fontSize;
const drops = Array(Math.floor(col)).fill(1);
function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#4cf777";
    ctx.font = fontSize + "px Consolas";
    for(let i = 0; i < drops.length; i++){
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if(drops[i] * fontSize > canvas.height && Math.random() > 0.97) {
            drops[i] = 0;
        }
        drops[i]++;
    }
    requestAnimationFrame(draw);
}
draw();
const modal = document.getElementById('modal');
const mTitle = document.getElementById('m-title');
const mInfo = document.getElementById('m-info');
const points = document.querySelectorAll('.point');
points.forEach(p => {
    p.onclick = () => {
        mTitle.innerText = p.dataset.title;
        mInfo.innerText = p.dataset.info;
        modal.style.display = "flex";
    }
})
document.querySelector('.close-btn').onclick = () => {
    modal.style.display = "none";
}
modal.onclick = (e) => {
    if(e.target === modal) {
        modal.style.display = "none";
    }
}
const input = document.getElementById('msg-input');
const btn = document.getElementById('gen-btn');
const out = document.getElementById('code-out');
btn.onclick = () => {
    const text = input.value.trim() || "青春向党，强国有我";
    const codeText = `/* 爱国寄语 */
const message = "${text}";
function youthPromise(){
    return message;
}
console.log(youthPromise());`
    out.innerText = codeText;
}
</script>
</body>
</html>
